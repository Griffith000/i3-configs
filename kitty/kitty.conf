
# ===== FONT & TEXT =====
font_family      Iosevka
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16

# ===== CATPPUCCIN MOCHA COLORS =====
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #cba6f7
color13 #cba6f7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# ===== CURSOR & BELL =====
cursor                  #f5e0dc
cursor_text_color       #1e1e2e
cursor_shape            block
cursor_blink_interval   0
enable_audio_bell       no

# ===== WINDOW =====
remember_window_size   no
initial_window_width   100
initial_window_height  30
window_padding_width   12
hide_window_decorations titlebar-only

# ===== PERFORMANCE (RAM Efficient) =====
scrollback_lines 10000
repaint_delay    10
input_delay      2
sync_to_monitor  no

# ===== MOUSE =====
mouse_hide_wait 2.0
url_color #89b4fa
url_style curly

# ===== KEYBINDINGS (i3wm Friendly) =====
map ctrl+shift+r reload_config
map ctrl+shift+w close_window
map ctrl+shift+n new_window
map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+equal launch --location=hsplit
map ctrl+shift+minus launch --location=vsplit
map ctrl+shift+j kitten relative_resize.py down 5
map ctrl+shift+k kitten relative_resize.py up 5
map ctrl+shift+h kitten relative_resize.py left 5
map ctrl+shift+l kitten relative_resize.py right 5
map ctrl+shift+z toggle_layout stack
