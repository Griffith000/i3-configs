# Use GLX backend for blur and vsync support
#backend = "glx";
backend = "xrender";

# Enable vertical sync to reduce tearing (if supported by driver)
vsync = true;

# Blur settings (Gaussian blur)
# blur = {
#   method = "gaussian";
#   size = 12;
#   deviation = 8.0;
# };
blur=false;


# Rounded window corners
rounded-corners = false;
# corner-radius = 12;

# Fade animations on window open/close
fading = false;
# fade-in-step = 0.06;
# fade-out-step = 0.06;

# Enable shadows for windows
shadow = false;
# shadow-radius = 7;
# shadow-opacity = 0.5;

# Exclude blur for panels/docks/desktops
# blur-background-exclude = [
#   "window_type = 'dock'",
#   "window_type = 'desktop'"
# ];

# Set transparency for ghostty terminal (85% opacity)
opacity-rule = [
  "85:class_g = 'ghostty'"
];
